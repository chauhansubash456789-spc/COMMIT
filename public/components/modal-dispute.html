<div class="modal-overlay" id="disputeModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:20px;">⚖️</span>
          <h3 style="font-size:16px;font-weight:800;">Open Formal Dispute</h3>
        </div>
        <button class="close-btn" onclick="closeDisputeModal()">&times;</button>
      </div>
      <div class="modal-body" style="padding:20px;">
        <div class="dispute-warning-banner" style="background:rgba(255,75,58,0.1);border:1px solid rgba(255,75,58,0.3);border-radius:var(--radius-inner);padding:14px;margin-bottom:16px;color:#fca5a5;font-size:12px;line-height:1.5;">
          <strong>CRITICAL INVARIANT:</strong> Opening a dispute immediately <strong>FREEZES</strong> normal settlement on Solana. Neither payout nor penalty will be dispatched until administrative review resolves the dispute.
        </div>

        <form id="disputeForm" onsubmit="handleDisputeSubmit(event)">
          <input type="hidden" id="disputeCommitmentId">
          <div class="form-group" style="margin-bottom:14px;">
            <label class="form-label">Commitment Goal</label>
            <input type="text" class="form-input input-dimmed" id="disputeCommitmentTitle" readonly>
          </div>

          <div class="form-group" style="margin-bottom:14px;">
            <label class="form-label">Dispute Reason (Required)</label>
            <textarea class="form-input" id="disputeReason" rows="3" required placeholder="Explain why the verification result is incorrect or why an attestation error occurred..."></textarea>
          </div>

          <div class="form-group" style="margin-bottom:18px;">
            <label class="form-label">Supporting Evidence / Notes (Optional)</label>
            <input type="text" class="form-input" id="disputeEvidence" placeholder="Provide URL or context to verify your claim">
          </div>

          <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button type="button" class="btn btn-secondary" onclick="closeDisputeModal()">Cancel</button>
            <button type="submit" class="btn btn-secondary" id="btnSubmitDispute" style="background:var(--sol-rose);color:#fff;border-color:var(--sol-rose);">
              ⚠️ Freeze Settlement & Submit Dispute
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
