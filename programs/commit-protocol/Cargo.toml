[package]
name = "commit-protocol"
version = "0.1.0"
description = "Commit Protocol: Solana Financial Commitment Protocol with Blinks, No-Loss Staking & Ed25519 Attestations"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "commit_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
solana-program = "1.18.26"
bytemuck = "1.16.1"
